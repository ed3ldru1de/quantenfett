# Variante A: alles auf GitHub. Kopieren nach .github/workflows/pages.yml
name: Seite bauen und veröffentlichen
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden Kalender neu einlesen
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          HOSTER: GitHub, Inc. (GitHub Pages)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
